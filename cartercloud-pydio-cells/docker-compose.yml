version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: cartercloud-pydio-cells_server_1
      APP_PORT: 8080
      APP_AUTH_ENABLED: "false"
  server:
    image: pydio/cells:4.4.18@sha256:a76131bb5ebee83ffdf88094f0a6cfb70a014c7586026521538dbe24074ec25b
    restart: on-failure
    init: true
    environment:
      CELLS_SITE_BIND: "0.0.0.0:8080"
      CELLS_SITE_EXTERNAL: "http://${DEVICE_DOMAIN_NAME:-umbrel.local}:8384"
      CELLS_SITE_NO_TLS: "1"
    volumes:
      - ${APP_DATA_DIR}/data/cells:/var/cells
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:10.11.14@sha256:dbe56e20372fc6d6b8e0e396866ba89c4c7f128c38c4f59aaa54d957db95790c
    restart: on-failure
    environment:
      MARIADB_ROOT_PASSWORD: "${APP_PASSWORD}"
      MARIADB_DATABASE: cells
      MARIADB_USER: pydio
      MARIADB_PASSWORD: "${APP_PASSWORD}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ${APP_DATA_DIR}/data/database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
