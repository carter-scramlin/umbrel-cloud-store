# Official T3 binaries are cached after SHA-256 verification. No third-party T3 image is used.
services:
  app_proxy:
    environment:
      APP_HOST: cartercloud-t3-code_server_1
      APP_PORT: 8080
  server:
    image: node:24.22.2-bookworm@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    user: 1000:1000
    init: true
    restart: on-failure
    working_dir: /projects
    environment:
      HOME: /home/node
      T3CODE_HOME: /home/node/.t3
      NPM_CONFIG_PREFIX: /home/node/.local
      PATH: /home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      T3_VERSION: 0.1.5
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/node
      - ${APP_DATA_DIR}/data/projects:/projects
      - ${APP_DATA_DIR}/launcher.mjs:/opt/launcher.mjs:ro
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        case "$$(uname -m)" in
          x86_64) arch=x64; checksum=21d50dcc9c634221b11b58d6a94350d2c6ee36905737b054b11fa4eba295a98b ;;
          aarch64|arm64) arch=arm64; checksum=389362e2a349ea62b38d9bc708f4fca2381936cccb2d326b5fc5d074b072aef1 ;;
          *) echo 'T3 Code supports amd64 and arm64.' >&2; exit 1 ;;
        esac
        runtime="$$HOME/.local/share/t3/$$T3_VERSION/$$arch"
        mkdir -p "$$HOME/.local/bin" "$$(dirname "$$runtime")"
        if [ ! -x "$$runtime/t3" ]; then
          echo "Downloading official T3 Code $$T3_VERSION ($$arch)..."
          staging="$$(mktemp -d "$$(dirname "$$runtime")/.download.XXXXXX")"
          trap 'rm -rf "$$staging"' EXIT
          archive="t3-$$T3_VERSION-linux-$$arch.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/pingdotgg/t3code/releases/download/v$$T3_VERSION/$$archive" -o "$$staging/release.tar.gz"
          printf '%s  %s\n' "$$checksum" "$$staging/release.tar.gz" | sha256sum --check --status
          mkdir "$$staging/runtime"
          tar -xzf "$$staging/release.tar.gz" -C "$$staging/runtime" --strip-components=1
          mv "$$staging/runtime" "$$runtime"
          rm -rf "$$staging"
          trap - EXIT
        fi
        ln -sfn "$$runtime/t3" "$$HOME/.local/bin/t3"
        export T3_BINARY="$$runtime/t3"
        export LD_LIBRARY_PATH="$$runtime/lib"
        exec node /opt/launcher.mjs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 15m
