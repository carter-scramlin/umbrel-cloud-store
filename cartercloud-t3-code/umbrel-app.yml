manifestVersion: 2.0
id: cartercloud-t3-code
storage:
  dataRoot: data
folderAccess:
  - id: projects
    name: Projects
    note: Select the projects folder T3 Code and its coding agents can modify. It appears at /projects. The folder must be writable by UID/GID 1000:1000.
    mounts:
      - service: server
        targetPath: /projects
        readOnly: false
category: developer
name: T3 Code
version: "0.1.5"
tagline: Run coding agents on your Umbrel from your browser
description: >-
  Open T3 Code from Umbrel to pair this browser automatically, then connect
  your coding provider in Settings → Providers. A provider account or API key
  is required to run coding tasks. This package does not include a subscription.
  First startup downloads and verifies the official T3 Code release and may
  take several minutes.


  Work with coding agents, projects, Git changes, terminals, and conversations
  from your browser. Projects live at /projects. Select an existing projects
  folder in Umbrel App Settings, or use the app's persistent default folder.
  Credentials, provider installations, settings, and conversation history persist.


  Umbrel login protection stays enabled. T3 Code can execute commands and modify
  files inside its container and selected projects folder. Built-in browser
  automation may require additional Linux libraries and sandbox configuration;
  it is not preconfigured in this community package.
releaseNotes: ""
developer: T3 Tools
website: https://t3.codes
dependencies: []
repo: https://github.com/pingdotgg/t3code
support: https://github.com/carter-scramlin/umbrel-cloud-store/issues
port: 8387
gallery: []
path: /umbrel
requiresHttps: true
defaultUsername: ""
defaultPassword: ""
icon: https://raw.githubusercontent.com/pingdotgg/t3code/6d450a4284852af137b2f3407fddd89eb76e7644/apps/web/public/apple-touch-icon.png
submitter: Carter Scramlin
submission: https://github.com/carter-scramlin/umbrel-cloud-store
