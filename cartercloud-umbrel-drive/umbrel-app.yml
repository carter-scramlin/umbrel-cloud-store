manifestVersion: 2.0
id: cartercloud-umbrel-drive
name: Umbrel Drive Preview
category: files
version: "0.1.0"
tagline: Keep your files in sync with your Umbrel
description: >-
  A community drive with an umbrelOS-inspired file browser, file history,
  trash, and expiring download links. Sync folders from Linux or install the
  web client on Android to browse, upload, and save files offline. Sign in
  with the app password shown by Umbrel.
developer: Carter Cloud
website: https://github.com/carter-scramlin/umbrel-cloud-store
repo: https://github.com/carter-scramlin/umbrel-cloud-store
support: https://github.com/carter-scramlin/umbrel-cloud-store/issues
submitter: Carter Scramlin
submission: https://github.com/carter-scramlin/umbrel-cloud-store
icon: https://raw.githubusercontent.com/carter-scramlin/umbrel-cloud-store/main/cartercloud-umbrel-drive/app/icon.svg
port: 8388
requiresHttps: true
path: /
storage:
  dataRoot: data
gallery: []
dependencies: []
defaultUsername: ""
deterministicPassword: true
releaseNotes: Initial community release for Linux and Android web clients.
