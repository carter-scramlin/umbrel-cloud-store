services:
  app_proxy:
    environment:
      APP_HOST: cartercloud-umbrel-drive_server_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"
  server:
    image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    user: "1000:1000"
    init: true
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-B", "/opt/drive/app/server.py"]
    environment:
      DRIVE_PASSWORD: "${APP_PASSWORD}"
      DRIVE_DATA: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/app:/opt/drive/app:ro
      - ${APP_DATA_DIR}/linux:/opt/drive/linux:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
