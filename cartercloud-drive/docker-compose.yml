services:
  app_proxy:
    environment:
      APP_HOST: cartercloud-drive_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: 'false'
  db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: on-failure
    environment:
      POSTGRES_DB: drive
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: ${APP_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U drive -d drive
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
        - cartercloud-drive-db
  redis:
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    restart: on-failure
    environment:
      REDIS_PASSWORD: ${APP_PASSWORD}
    command:
    - sh
    - -ec
    - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
      default:
        aliases:
        - cartercloud-drive-redis
  web:
    image: nextcloud:35.0.2-apache@sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
    restart: on-failure
    environment:
      POSTGRES_HOST: cartercloud-drive-db
      POSTGRES_DB: drive
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      REDIS_HOST: cartercloud-drive-redis
      REDIS_HOST_PASSWORD: ${APP_PASSWORD}
      NEXTCLOUD_ADMIN_USER: umbrel
      NEXTCLOUD_ADMIN_PASSWORD: ${APP_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${APP_DOMAIN} ${APP_DOMAIN}:8390 ${DEVICE_DOMAIN_NAME:-umbrel.local}
        ${DEVICE_HOSTNAME:-umbrel}:8390 ${APP_DRIVE_LOCAL_IPS:-} ${APP_HIDDEN_SERVICE:-}
      TRUSTED_PROXIES: ${NETWORK_IP:-10.21.0.1}/16
      PHP_UPLOAD_LIMIT: 16G
      PHP_MEMORY_LIMIT: 1024M
      APACHE_BODY_LIMIT: 0
      NEXTCLOUD_INIT_HTACCESS: 'true'
      XDG_CACHE_HOME: /tmp/drive-cache
      DRIVE_HEALTH_HOST: ${APP_DOMAIN}
    volumes:
    - ${APP_DATA_DIR}/data/nextcloud:/var/www/html
    - ${APP_DATA_DIR}/server/umbreldrive:/var/www/html/custom_apps/umbreldrive:ro
    - ${APP_DATA_DIR}/server/hooks:/docker-entrypoint-hooks.d/post-installation:ro
    - ${APP_DATA_DIR}/server/hooks:/docker-entrypoint-hooks.d/before-starting:ro
    - ${APP_DATA_DIR}/server/drive.config.php:/usr/src/nextcloud/config/umbreldrive.config.php:ro
    - ${APP_DATA_DIR}/server:/opt/umbreldrive:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - php
      - /opt/umbreldrive/health.php
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 5
    entrypoint:
    - sh
    - /opt/umbreldrive/start.sh
    command:
    - apache2-foreground
  cron:
    image: nextcloud:35.0.2-apache@sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
    restart: on-failure
    entrypoint:
    - sh
    - /opt/umbreldrive/cron-start.sh
    environment:
      REDIS_HOST: cartercloud-drive-redis
      REDIS_HOST_PASSWORD: ${APP_PASSWORD}
      POSTGRES_HOST: cartercloud-drive-db
      POSTGRES_DB: drive
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      XDG_CACHE_HOME: /tmp/drive-cache
    volumes:
    - ${APP_DATA_DIR}/data/nextcloud:/var/www/html
    - ${APP_DATA_DIR}/server/umbreldrive:/var/www/html/custom_apps/umbreldrive:ro
    - ${APP_DATA_DIR}/server:/opt/umbreldrive:ro
    depends_on:
      web:
        condition: service_healthy
