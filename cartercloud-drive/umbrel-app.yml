manifestVersion: 2.0
id: cartercloud-drive
name: Umbrel Drive
category: files
version: 1.2.0-rc.2
tagline: Your files. Right at home.
description: "A community drive for your Umbrel, with a clean file browser and native Linux\
  \ and Android clients built on Nextcloud. Keep folders in sync, browse offline on Android,\
  \ automatically upload photos, share files with passwords and expiry dates, collect uploads,\
  \ and recover deleted files and previous versions. Manage users, groups, quotas, and connected\
  \ devices.\n\nSign in as umbrel with the generated app password. Open Devices & Files to download\
  \ clients and connect them to this app's HTTPS address. Linux scheduled upload-only backups\
  \ use the included backup helper. Advanced office editing, and full-text search require additional\
  \ Nextcloud apps or services. See the feature matrix for gaps compared with Synology Drive.\
  \ This is community software, not an official Umbrel or Synology product.\n\nThis edition\
  \ installs separately from the original Umbrel Drive Preview. Existing preview data is not\
  \ migrated automatically. Connect a folder in Umbrel app settings \u2192 Storage \u2192 Umbrel\
  \ Files. The same files are then accessible in Files and the umbrel Drive account; other accounts\
  \ require an explicit share. Drive metadata and PostgreSQL stay in the app's private data\
  \ directory."
developer: Carter Cloud
website: https://github.com/carter-scramlin/umbrel-cloud-store/tree/main/cartercloud-drive
repo: https://github.com/carter-scramlin/umbrel-cloud-store
support: https://github.com/carter-scramlin/umbrel-cloud-store/issues
submitter: Carter Scramlin
submission: https://github.com/carter-scramlin/umbrel-cloud-store
icon: https://raw.githubusercontent.com/carter-scramlin/umbrel-cloud-store/main/cartercloud-drive/server/umbreldrive/img/logo.svg
port: 8390
requiresHttps: true
path: /
storage:
  dataRoot: data
gallery:
- https://raw.githubusercontent.com/carter-scramlin/umbrel-cloud-store/main/cartercloud-drive/assets/fast-browser.jpg
- https://raw.githubusercontent.com/carter-scramlin/umbrel-cloud-store/main/cartercloud-drive/assets/files.jpg
- https://raw.githubusercontent.com/carter-scramlin/umbrel-cloud-store/main/cartercloud-drive/assets/setup.jpg
- https://raw.githubusercontent.com/carter-scramlin/umbrel-cloud-store/main/cartercloud-drive/assets/integration.jpg
dependencies: []
defaultUsername: umbrel
deterministicPassword: true
releaseNotes: 'Your Umbrel now shows storage and connected folders, with a safe Copy to Umbrel Files action. Native Android 1.2.0 and Linux 1.1.0 add Tailscale connection profiles and explicit HTTP support on port 8391. HTTPS remains the default on 8390. Remote profiles apply to new sign-ins; existing accounts retain their address. This remains a community release candidate pending final visual and device QA.'
folderAccess:
- id: umbrel-files
  name: Umbrel Files
  note: Choose the folder to connect to Drive. Its contents appear as Umbrel Files for the umbrel
    Drive account. Other accounts need an explicit share. Changes in either app affect the same
    files.
  mounts:
  - service: web
    targetPath: /umbrel-files
    readOnly: false
  - service: cron
    targetPath: /umbrel-files
    readOnly: false
- id: umbrel-photos
  name: Umbrel Photos
  note: 'Optional: select Home/Photos to browse backups from the official Umbrel mobile app
    in Drive. Read-only; only the umbrel Drive account can see these photos until explicitly
    shared. Photo backup and deletion stay in Umbrel Photos.'
  mounts:
  - service: web
    targetPath: /umbrel-photos
    readOnly: true
  - service: cron
    targetPath: /umbrel-photos
    readOnly: true
