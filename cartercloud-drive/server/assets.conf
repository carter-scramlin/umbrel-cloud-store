# Compress only public static assets. Keep PHP, DAV, and user file responses on
# the upstream path, with no shared cache or changes to their access controls.
BrotliCompressionQuality 5
<Directory /var/www/html/dist>
    <FilesMatch "\.(js|mjs|css)$">
        SetOutputFilter BROTLI_COMPRESS;DEFLATE
    </FilesMatch>
</Directory>
<Directory /var/www/html/core/css>
    <FilesMatch "\.css$">
        SetOutputFilter BROTLI_COMPRESS;DEFLATE
    </FilesMatch>
</Directory>
<Directory /var/www/html/custom_apps/umbreldrive/css>
    <FilesMatch "\.css$">
        SetOutputFilter BROTLI_COMPRESS;DEFLATE
    </FilesMatch>
</Directory>
