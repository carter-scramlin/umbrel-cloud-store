services:
  app_proxy:
    environment:
      APP_HOST: cartercloud-pancakeslicer_server_1
      APP_PORT: 6868
  permissions:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    user: "0:0"
    restart: "no"
    network_mode: none
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command: [sh, -ec, "chown 65532:65532 /data"]
  server:
    image: ghcr.io/zimengxiong/pancakeslicer:0.5.5@sha256:92af64c317fd9cc69a84dd4ba650f422d1952acf374a3b9ae6c10fdfd01008a7
    user: "65532:65532"
    init: true
    restart: on-failure
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      ORCA_WEB_MAX_JOBS: "2"
      ORCA_WEB_PRINTER_NETWORK: lan
      PANCAKE_STAGE_CACHE_MAX_MB: "1024"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8g
